<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #dc2626; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
    .content { background: #f9fafb; padding: 30px; border-radius: 0 0 8px 8px; }
    .info-table { width: 100%; background: white; border-radius: 8px; margin: 20px 0; }
    .info-table td { padding: 12px 15px; border-bottom: 1px solid #e5e7eb; }
    .info-table td:first-child { font-weight: bold; color: #374151; width: 30%; }
    .footer { text-align: center; color: #6b7280; margin-top: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔔 New User Registration</h1>
    </div>
    <div class="content">
      <p>A new user has just registered! Here are the details:</p>
      <table class="info-table">
        <tr>
          <td>Title</td>
          <td>{{title}}</td>
        </tr>
        <tr>
          <td>First Name</td>
          <td>{{firstName}}</td>
        </tr>
        <tr>
          <td>Last Name</td>
          <td>{{lastName}}</td>
        </tr>
        <tr>
          <td>Email</td>
          <td>{{email}}</td>
        </tr>
        <tr>
          <td>User ID</td>
          <td>{{userId}}</td>
        </tr>
        <tr>
          <td>Registered At</td>
          <td>{{registeredAt}}</td>
        </tr>
      </table>
      <div class="footer">
        <p>This email is automatically generated, please do not reply.</p>
      </div>
    </div>
  </div>
</body>
</html>
