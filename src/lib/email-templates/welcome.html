<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #2563eb; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
    .content { background: #f9fafb; padding: 30px; border-radius: 0 0 8px 8px; }
    .greeting { font-size: 20px; margin-bottom: 20px; }
    .info { background: white; padding: 20px; border-radius: 8px; margin: 20px 0; }
    .btn { display: inline-block; background: #2563eb; color: white; padding: 12px 30px; text-decoration: none; border-radius: 6px; font-weight: bold; margin: 20px 0; }
    .btn:hover { background: #1d4ed8; }
    .footer { text-align: center; color: #6b7280; margin-top: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Welcome Aboard!</h1>
    </div>
    <div class="content">
      <p class="greeting">Dear {{title}} {{firstName}} {{lastName}},</p>
      <p>Thank you for registering as a member!</p>
      <div class="info">
        <p><strong>Your Account Information:</strong></p>
        <p>Email: {{email}}</p>
        <p>Registered At: {{registeredAt}}</p>
      </div>
      <!-- DEEPLINK_PLACEHOLDER -->
      <p>If you have any questions, please feel free to contact us.</p>
      <div class="footer">
        <p>This email is automatically generated, please do not reply.</p>
      </div>
    </div>
  </div>
</body>
</html>
